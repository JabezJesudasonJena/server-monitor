# ─────────────────────────────────────────────────────────────
#  Fluent Bit — main configuration
#
#  Environment variables (set in docker-compose / docker run):
#    FLUENT_HTTP_HOST  — HTTP collector hostname  (required)
#    FLUENT_HTTP_PORT  — HTTP collector port       (default: 9880)
#    FLUENT_HTTP_URI   — HTTP collector path       (default: /)
# ─────────────────────────────────────────────────────────────

[SERVICE]
    # Flush buffered records every N seconds
    Flush             5
    Daemon            Off
    Log_Level         warn
    Parsers_File      /fluent-bit/etc/parsers.conf
    # Small in-memory buffer — not persisted between restarts
    storage.type      memory

# ── INPUT: tail combined.log (all levels) ───────────────────
[INPUT]
    Name              tail
    Tag               app.combined
    Path              /app/logs/combined.log
    # Use multiline parser so stack traces stay as one record
    Multiline.Parser  winston_multiline
    DB                /tmp/flb_combined.db
    Refresh_Interval  2
    Skip_Empty_Lines  On
    # Read from the beginning on first run; follow on restart
    Read_From_Head    True

# ── INPUT: tail error.log (errors only) ─────────────────────
[INPUT]
    Name              tail
    Tag               app.errors
    Path              /app/logs/error.log
    Multiline.Parser  winston_multiline
    DB                /tmp/flb_error.db
    Refresh_Interval  2
    Skip_Empty_Lines  On
    Read_From_Head    True

# ── FILTER: lift parsed fields to top-level ─────────────────
[FILTER]
    Name              parser
    Match             app.*
    Key_Name          log
    Parser            winston
    Reserve_Data      On
    Preserve_Key      Off

# ── OUTPUT: forward to HTTP endpoint ────────────────────────
[OUTPUT]
    Name              http
    Match             *
    Host              ${FLUENT_HTTP_HOST}
    Port              ${FLUENT_HTTP_PORT}
    URI               ${FLUENT_HTTP_URI}
    Format            json
    Json_Date_Key     @timestamp
    Json_Date_Format  iso8601
    # Retry up to 3 times before discarding
    Retry_Limit       3
