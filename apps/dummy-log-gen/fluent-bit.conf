# ─────────────────────────────────────────────────────────────
#  Fluent Bit — main configuration
#
#  Pipeline:
#    combined.log (all levels: info/warn/debug/http/error)
#      └─ [FILTER grep] keep only level = "error"
#           └─ [OUTPUT http] forward to collector
#
#  This means the normal log generator produces info/warn/debug/http
#  records that are read but DROPPED here. When the error generator
#  is started (GET /generator/start-errors), the error records flow
#  through the grep filter and are forwarded to the HTTP endpoint.
#
#  Environment variables:
#    FLUENT_HTTP_HOST  — HTTP collector hostname  (required)
#    FLUENT_HTTP_PORT  — HTTP collector port       (default: 3000)
#    FLUENT_HTTP_URI   — HTTP collector path       (default: /log-analysis/ingest/job-123)
# ─────────────────────────────────────────────────────────────

[SERVICE]
    Flush             2
    Daemon            Off
    Log_Level         info
    Parsers_File      /fluent-bit/etc/parsers.conf
    storage.type      memory

# ── INPUT: tail combined.log (all levels) ───────────────────
# Winston writes every log level here. Fluent Bit reads all of
# them and forwards them to the HTTP endpoint.
[INPUT]
    Name              tail
    Tag               app.logs
    Path              /app/logs/combined.log
    Parser            winston_json
    DB                /tmp/flb_combined.db
    Refresh_Interval  1
    Skip_Empty_Lines  On
    Read_From_Head    True

# ── FILTER: keep ONLY error-level records (Optional) ─────────
# Uncomment this filter if you ONLY want error-level logs forwarded.
# Left commented out so all logs seen in the terminal are forwarded to NestJS.
#[FILTER]
#    Name    grep
#    Match   app.logs
#    Regex   level ^error$

# ── OUTPUT: forward errors to HTTP endpoint ─────────────────
[OUTPUT]
    Name              http
    Match             app.logs
    Host              ${FLUENT_HTTP_HOST}
    Port              ${FLUENT_HTTP_PORT}
    URI               ${FLUENT_HTTP_URI}
    Format            json
    Json_Date_Key     @timestamp
    Json_Date_Format  iso8601
    Retry_Limit       3
