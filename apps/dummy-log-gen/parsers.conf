# ─────────────────────────────────────────────────────────────
#  Parsers for Winston JSON log format
#
#  Winston file-transport now writes NDJSON (one JSON per line):
#  {
#    "level":     "error",
#    "message":   "Database connection failed",
#    "timestamp": "2026-10-01T01:05:00.123Z",
#    "host":      "db.internal",
#    "error":     "ECONNREFUSED"
#  }
# ─────────────────────────────────────────────────────────────

# ── JSON parser — handles each log line directly ─────────────
[PARSER]
    Name        winston_json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On

# ── Multiline parser — keeps stack traces with their error ───
# Stack trace lines start with spaces ("    at ...") or "Error:"
[MULTILINE_PARSER]
    Name          winston_multiline
    Type          regex
    Flush_Timeout 2000

    # A new record starts when a line begins with "{" (JSON object open)
    Rule          "start_state"  "/^\{/"        "stack_state"
    # Continuation: indented lines (stack frames) or "Error:" prefix
    Rule          "stack_state"  "/^[\t ]/"     "stack_state"
    Rule          "stack_state"  "/^Error:/"    "stack_state"
