# ─────────────────────────────────────────────────────────────
#  Parsers for Winston log format
#
#  Winston file-transport line format:
#    [YYYY-MM-DD HH:MM:SS] LEVEL: message {"meta":"value"}
#
#  Stack trace lines (from errors) start with spaces or "Error:"
#  and are captured by the multiline parser below.
# ─────────────────────────────────────────────────────────────

# ── Single-line parser ───────────────────────────────────────
[PARSER]
    Name        winston
    Format      regex
    # Captures: time, level, message (rest of line including JSON meta)
    Regex       ^\[(?<time>[^\]]+)\] (?<level>[A-Z]+): (?<message>.+)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S
    Time_Keep   On

# ── Multiline parser — keeps stack traces with their error ───
[MULTILINE_PARSER]
    Name          winston_multiline
    Type          regex
    Flush_Timeout 2000

    # A new log record starts when the line begins with "["
    Rule          "start_state"  "/^\[/"   "stack_state"

    # Stack-trace / continuation lines: indented or start with "Error:"
    Rule          "stack_state"  "/^[\t ]/" "stack_state"
    Rule          "stack_state"  "/^Error:/" "stack_state"
